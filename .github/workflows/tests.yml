# Reproducibility CI (proposal Amendment 2): runs the full test suite on a
# clean GitHub-hosted runner (free for public repositories) on every push and
# pull request, so anyone can see the results reproduce off the author's laptop.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Spark 4.0 is the development version; Spark 3.5 is what managed cloud
    # services (e.g. Google Dataproc 2.2) run, so the suite is checked on both.
    name: pytest (PySpark ${{ matrix.pyspark }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pyspark: ["4.0.3", "3.5.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (required by PySpark 4.x, supported by 3.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyspark==${{ matrix.pyspark }}" rdflib==7.6.0 "pandas>=2.2.0" "scipy>=1.10" "pytest>=8.0"

      - name: Run tests
        env:
          TSARM_DRIVER_MEMORY: 4g
          TSARM_SHUFFLE_PARTITIONS: "8"
        run: python -m pytest -q
